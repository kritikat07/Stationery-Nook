server.port=${PORT:8080}

# Database Configuration (Persistent file-based H2 by default, overrides with MySQL if environment variables are set)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/stationerynook;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret configurations (At least 256 bits for HMAC-SHA)
jwt.secret=9a4f2c8d6e3b5a7f1c9d2e8b7a6f5d4c3b2a1e0f9c8d7b6a5e4d3c2b1a0f9e8d
jwt.expirationMs=86400000
